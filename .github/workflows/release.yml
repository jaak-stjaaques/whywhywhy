# Build WHYWHYWHY, run the host tests, and publish the FM-1 package on version tags.
# The JieLi toolchain comes from pkgman.jieliapp.com (tools/get_toolchain.sh), the AC79 SDK from gitee.com, as in
# sloopDX's and OberVave's workflows. Run by hand (workflow_dispatch) for a test build without a release.
name: release

on:
  push:
    branches: [main]           # every push: a test build, the .fwsc as a download in the run (no release)
    tags: ['v*']               # a version tag: the release
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # the release on a tag
      id-token: write          # the attestation's signing identity
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Python packages
        run: python3 -m pip install Pillow

      - name: JieLi toolchain (pkgman.jieliapp.com)
        run: sh tools/get_toolchain.sh

      - name: JieLi AC79 SDK (three files of it are placed in the package)
        run: |
          for i in 1 2 3; do                     # (gitee.com drops a clone now and then: try again)
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK

      - name: Build (the SMK-37 first, the FM-1 last, as the tests expect)
        run: |
          BOARD=smk37 sh build.sh
          BOARD=smk37 MODEL=elite sh build.sh
          BOARD=smk37 MODEL=mke sh build.sh
          sh build.sh

      - name: Host tests
        run: sh tests/run_tests.sh

      - name: Release packages (tags only)
        if: github.ref_type == 'tag'
        run: |
          version=$(cat VERSION)
          test "$GITHUB_REF_NAME" = "v$version"
          (cd build && sha256sum "whywhywhy_$version.fwsc" > SHA256SUMS)

      - name: The latest build on the branch `build` (main only; one file, replaced each time)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p latest && cp build/whywhywhy_*.fwsc latest/
          cd latest
          git init -q -b build
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "latest build of $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" build

      - uses: actions/upload-artifact@v4
        with:
          name: whywhywhy-fwsc
          path: |
            build/whywhywhy_*.fwsc
            build/dinghy*.fwsc
          if-no-files-found: error

      - name: Attest the packages (tags only)
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/whywhywhy_*.fwsc

      - name: Release (tags only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release already exists for $GITHUB_REF_NAME"
            exit 0
          fi
          version=$(cat VERSION)
          release_flags=()
          case "$version" in
            0.*|*-*) release_flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "WHYWHYWHY $version" "${release_flags[@]}" \
            "build/whywhywhy_$version.fwsc" build/SHA256SUMS
